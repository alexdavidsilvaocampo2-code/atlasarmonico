<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Armónico · Prueba</title>
<meta name="description" content="Piano de 7 octavas con acordes, escalas y digitación en las 21 tónicas. 7-octave piano with chords, scales and fingering in all 21 keys.">
<meta name="theme-color" content="#0e0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas Armónico">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
/* Layout: una consola de piano lacado — lectura del acorde arriba, el teclado de 7 octavas como pieza central, biblioteca debajo */
:root{
  --bg:#0e0d0f; --panel:#18161a; --panel-2:#221f24; --line:#322d33;
  --fg:#efe8db; --muted:#a59c8f; --dim:#6f675e;
  --brass:#d6ae60; --on-brass:#1d160a; --felt:#7f1f27;
  --r-root:#e6b652; --r-third:#4fc3a7; --r-fifth:#72a5f0; --r-seventh:#c98ae4; --r-ext:#f0817b;
  --ivory:#f8f3e7; --ivory-edge:#cfc6b2; --ink:#1b1610;
  --f-display:'Cormorant Garamond','Noto Music',Georgia,serif;
  --f-body:'Manrope','Noto Music',system-ui,sans-serif;
  --f-mono:'JetBrains Mono','Noto Music',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{max-width:1520px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:18px 48px;display:grid;gap:18px}
.app>*{min-width:0}

/* barra superior */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;letter-spacing:.01em}
.brand h1 em{color:var(--brass);font-weight:500}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.tabs button{border:0;background:none;cursor:pointer;padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;cursor:pointer;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--brass)}
.prefs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prefs label{font-size:12px;color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel h2{margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* consola */
.console{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(230px,280px);gap:18px}
@media (max-width:1100px){.console{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.readout{grid-column:1/-1;order:-1}}
@media (max-width:660px){.console{grid-template-columns:minmax(0,1fr)}}

.roots{display:grid;grid-template-columns:22px repeat(7,minmax(0,1fr));gap:4px}
.roots .rl{font-size:15px;color:var(--dim);align-self:center;text-align:center;font-family:var(--f-display)}
.rb{border:0;cursor:pointer;padding:7px 0;border-radius:7px;font-family:var(--f-display);font-size:18px;font-weight:700;background:var(--panel-2);line-height:1.15}
.rb.nat{background:#2b272d}
.rb:hover{background:var(--line)}
.rb.enh{box-shadow:inset 0 0 0 1px var(--brass)}
.rb[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);box-shadow:none}
.roots-note{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.45}

.readout{display:flex;flex-direction:column;gap:10px}
.sym{font-family:var(--f-display);font-weight:600;font-size:clamp(54px,7vw,92px);line-height:.95;letter-spacing:-.01em;text-wrap:balance}
.sym.long{font-size:clamp(38px,4.6vw,62px);line-height:1.02}
.sym .q{font-style:italic;font-weight:500;color:var(--brass)}
.sym .bass{color:var(--muted);font-size:.62em;font-weight:500}
.subname{font-size:17px;font-weight:600}
.subname span{color:var(--muted);font-weight:500}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 18px;margin:6px 0 0;align-items:baseline}
.facts dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts dd{margin:0;min-width:0}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;align-items:baseline;gap:6px;padding:3px 9px;border-radius:7px;font-weight:800;font-size:15px;
  background:color-mix(in oklab,var(--hc) 16%,var(--panel-2));border:1px solid color-mix(in oklab,var(--hc) 55%,transparent)}
.nchip i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--hc)}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.pill.warn{color:var(--r-ext);border-color:color-mix(in oklab,var(--r-ext) 50%,transparent)}

.dia{margin-top:8px;display:grid;gap:6px}
.dia-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dcell{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:7px 4px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.dcell:hover{border-color:var(--muted)}
.dcell[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 16%,var(--panel-2))}
.dcell .rn{font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--brass)}
.dcell .cs{font-size:12.5px;font-weight:700;overflow-wrap:anywhere}
.dia .eyebrow{margin-top:4px}

.ctl{display:flex;flex-direction:column;gap:16px}
.ctl .grp{display:flex;flex-direction:column;gap:7px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:18px;font-weight:700}
.stepper button:hover{border-color:var(--muted)}
.stepper output{font-family:var(--f-display);font-size:30px;font-weight:700;min-width:28px;text-align:center}
.stepper small{color:var(--muted);font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.btn svg{width:12px;height:12px;fill:currentColor}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--hc);flex:none}
.inv{flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--brass)}

/* instrumento */
.instrument{background:linear-gradient(180deg,#1d1b1f 0,#0b0a0c 100%);border:1px solid #2b272c;border-radius:18px;padding:10px 12px 14px;box-shadow:0 30px 60px -30px #000, inset 0 1px 0 #39343b}
.nameboard{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:4px 6px 10px}
.nameboard .mark{font-family:var(--f-display);font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--brass);font-size:13px}
.nameboard .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.zoom{display:flex;gap:6px;align-items:center}
.tp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.tp .tp-lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.tp button{border:1px solid color-mix(in oklab,var(--brass) 55%,#3a353c);background:#1a181c;color:var(--fg);border-radius:9px;cursor:pointer;min-width:44px;height:36px;padding:0 10px;font:800 15px var(--f-body)}
.tp button:hover{background:color-mix(in oklab,var(--brass) 18%,#1a181c)}
.tp button.big{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.tp button.reset{min-width:36px;font-size:16px;border-color:#3a353c}
.tp output{min-width:150px;text-align:center;font:700 15px var(--f-body);color:var(--fg);padding:0 6px}
.tp output small{display:block;font:600 11px var(--f-mono);color:var(--brass);letter-spacing:.04em}
@media (max-width:700px){
  .nameboard>.tp{order:-1;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:6px}
  .nameboard>.tp .tp-lbl{display:none}
  .nameboard>.tp output{grid-column:1/-1;grid-row:1;min-width:0}
  .nameboard>.tp button{min-width:0;height:44px;font-size:17px}
  .nameboard>.tp button[data-tp="-2"]{grid-column:1}.nameboard>.tp button[data-tp="-1"]{grid-column:2}
  .nameboard>.tp button[data-tp="1"]{grid-column:3}.nameboard>.tp button[data-tp="2"]{grid-column:4}
  .nameboard>.tp button.reset{grid-column:5}
}
.zoom button{border:1px solid #3a353c;background:#1a181c;border-radius:8px;cursor:pointer;padding:4px 10px;font-weight:700;font-size:13px;color:var(--fg)}
.zoom button:hover{border-color:var(--muted)}
.felt{height:7px;background:linear-gradient(180deg,#a02c34,#5b141a);border-radius:3px 3px 0 0}
.scroller{overflow-x:auto;overflow-y:hidden;scrollbar-color:#3a353c transparent;touch-action:pan-x;border-radius:0 0 6px 6px}
.keys{position:relative;height:var(--kh,170px);user-select:none;-webkit-user-select:none}
.key{position:absolute;top:0;cursor:pointer}
.white{width:var(--kw);height:100%;z-index:1;border-left:1px solid var(--ivory-edge);border-bottom:1px solid #b9ae97;border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,#d9d1bf 0,var(--ivory) 5%,#f4eee1 82%,#e4dbc8 100%);
  box-shadow:inset 0 -7px 0 #e2d9c5, inset 0 2px 7px rgba(0,0,0,.28)}
.black{width:calc(var(--kw)*.6);height:62%;z-index:2;border-radius:0 0 4px 4px;
  background:linear-gradient(180deg,#000 0,#2c2b30 72%,#19181b 100%);
  box-shadow:0 4px 5px rgba(0,0,0,.6), inset 0 -6px 0 #060607, inset 1px 0 0 #403d44, inset -1px 0 0 #0a0a0b}
.white.on{background:linear-gradient(180deg,color-mix(in oklab,var(--hc) 40%,#d9d1bf) 0,color-mix(in oklab,var(--hc) 34%,var(--ivory)) 10%,color-mix(in oklab,var(--hc) 62%,var(--ivory)) 100%);
  box-shadow:inset 0 -7px 0 color-mix(in oklab,var(--hc) 75%,#7a6a4a), inset 0 2px 7px rgba(0,0,0,.28)}
.black.on{background:linear-gradient(180deg,color-mix(in oklab,var(--hc) 40%,#000) 0,color-mix(in oklab,var(--hc) 80%,#151416) 100%);
  box-shadow:0 0 14px color-mix(in oklab,var(--hc) 55%,transparent), inset 0 -6px 0 color-mix(in oklab,var(--hc) 45%,#000)}
.white.sel{--hc:var(--brass)}
.black.sel{--hc:var(--brass)}
.white.press{box-shadow:inset 0 -2px 0 #d6ccb6, inset 0 3px 10px rgba(0,0,0,.35);filter:brightness(.94)}
.black.press{height:61%;box-shadow:0 2px 2px rgba(0,0,0,.6), inset 0 -2px 0 #060607;filter:brightness(1.25)}
.tag{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none;white-space:nowrap}
.black .tag{bottom:10px}
.tag .nm{font-weight:800;font-size:clamp(9px,calc(var(--kw)*.42),14px);color:var(--ink);line-height:1.1}
.tag .dg{font-family:var(--f-mono);font-size:clamp(8px,calc(var(--kw)*.33),11px);color:var(--ink);opacity:.72;line-height:1.2}
.black .tag .nm,.black .tag .dg{color:#fff}
.oct{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:clamp(8px,calc(var(--kw)*.36),11px);color:#968b75;font-family:var(--f-mono);pointer-events:none}
.mid .oct{color:#7a5a17;font-weight:700}
.dot::after{content:"";position:absolute;left:50%;bottom:28px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);background:var(--hc);box-shadow:0 0 0 1.5px rgba(0,0,0,.18)}
.black.dot::after{bottom:12px}
.dot.r-root::after{width:12px;height:12px;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.tag .fg{display:grid;place-items:center;width:clamp(14px,calc(var(--kw)*.74),26px);aspect-ratio:1;border-radius:50%;margin-bottom:3px;
  background:var(--ink);color:#fff;font-weight:800;font-size:clamp(9px,calc(var(--kw)*.44),15px);line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.black .tag .fg{width:clamp(12px,calc(var(--kw)*.5),20px);background:#fff;color:#111}
.tag .fg:empty{display:none}
.key.lh .tag .fg{background:transparent;border:2px solid var(--ink);color:var(--ink);box-shadow:none}
.black.lh .tag .fg{border-color:#fff;color:#fff}
.keys.compact .tag .dg{display:none}
.keys.tiny .tag .nm,.keys.tiny .tag .dg{display:none}
.fseq{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:2px 3px 2px 9px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:14px}
.fchip b{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px}
.fchip.lh b{background:transparent;border:1.5px solid var(--fg);color:var(--fg)}
.fseq .hl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.fnote{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.fnote li{margin:2px 0}
.fingers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.fingers b{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:13px}
.under{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:10px 6px 0;font-size:12px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid #3a353c;border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--fg);background:#1a181c}

/* parte inferior */
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,350px);gap:18px;align-items:start}
@media (max-width:920px){.lower{grid-template-columns:minmax(0,1fr)}}
.libhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{flex:1 1 220px;max-width:340px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;font-size:14px}
.search::placeholder{color:var(--dim)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cats button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.cats button:hover{color:var(--fg)}
.cats button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cats button small{opacity:.6;margin-left:4px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ghead{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin-top:10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.ghead:first-child{margin-top:0}
.ghead b{font-family:var(--f-display);font-size:21px;font-weight:600}
.ghead span{font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.chip:hover{border-color:var(--muted)}
.chip b{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.chip b em{color:var(--brass);font-weight:600}
.chip span{font-size:12px;color:var(--muted);line-height:1.3}
.chip[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 14%,var(--panel-2))}
.empty{grid-column:1/-1;color:var(--muted);padding:18px 0}

.list{display:flex;flex-direction:column;gap:1px;max-height:640px;overflow:auto;margin-inline:-6px}
.row{border:0;background:none;cursor:pointer;display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr);gap:4px 12px;padding:7px 8px;border-radius:8px;text-align:left;align-items:baseline}
.row:hover{background:var(--panel-2)}
.row[aria-pressed="true"]{background:color-mix(in oklab,var(--brass) 15%,var(--panel-2))}
.row b{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.1}
.row span{font-size:13px;color:var(--muted);font-family:var(--f-mono);overflow-wrap:anywhere}
.row .pill{margin-left:6px}
.side-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45}
.ivtable{width:100%;border-collapse:collapse;font-size:13.5px}
.ivtable td,.ivtable th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.ivtable th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ivtable td:first-child{font-family:var(--f-mono);color:var(--brass)}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<style>
/* v2: dos manos, diagrama de manos e idiomas */
.tag .fgs{display:flex;gap:2px;margin-bottom:3px}
.tag .fg{margin-bottom:0}
.tag .fg.l{background:transparent;border:2px solid var(--ink);color:var(--ink);box-shadow:none}
.black .tag .fg.l{border-color:#fff;color:#fff;background:transparent}
.hands{width:100%;height:auto;display:block}
.hands .palm{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5}
.hands .finger{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5;transition:fill .2s,stroke .2s}
.hands .finger.on{fill:var(--brass);stroke:var(--brass)}
.hands .finger.on.lh{fill:color-mix(in oklab,var(--brass) 22%,var(--panel-2));stroke:var(--brass);stroke-width:2.5}
.hands .fnum{font:700 12px var(--f-body);fill:var(--muted);text-anchor:middle}
.hands .fnum.on{fill:var(--on-brass)}
.hands .fnum.on.lh{fill:var(--fg)}
.hands .hlabel{font:700 10px var(--f-body);letter-spacing:.12em;fill:var(--muted);text-anchor:middle;text-transform:uppercase}
.hands .axis{font:500 10px var(--f-mono);fill:var(--dim)}
.hands .axisline{stroke:var(--line);stroke-width:1}
.hand-note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.fseq{margin-bottom:4px}
.lang button{min-width:40px}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.tabs{flex-wrap:wrap;justify-content:center}
@media (max-width:560px){.tabs button{padding:7px 11px;font-size:13px}}
.tr-in{width:100%;min-height:76px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:500 16px/1.5 var(--f-mono)}
.tr-in::placeholder{color:var(--dim)}
.tr-keys{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px}
.tr-keys select{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.tr-arrow{color:var(--brass);font-size:20px}
.tr-dest{white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tr-to{font-family:var(--f-display);font-size:22px;font-weight:700}
.tr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tr-card{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:center;min-width:0}
.tr-card:hover{border-color:var(--muted)}
.tr-card[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 16%,var(--panel-2))}
.tr-card .rn{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--brass)}
.tr-card .new{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.tr-card .old{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tr-card.bad{border-color:color-mix(in oklab,var(--r-ext) 60%,transparent);cursor:default}
.tr-card.bad .new{color:var(--r-ext);font-size:18px}
.tr-ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tr-ex button{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tr-ex button:hover{border-color:var(--muted)}
.tr-ex b{font-size:14px}
.tr-ex span{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.tr-help{font-size:13.5px;color:var(--muted);line-height:1.6}
.tr-help code{font-family:var(--f-mono);color:var(--fg);background:var(--panel-2);border-radius:5px;padding:1px 6px}
.buy{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--brass);color:var(--on-brass);font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px}
.buy:hover{filter:brightness(1.08)}
.badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--brass);border:1px solid color-mix(in oklab,var(--brass) 55%,transparent);border-radius:999px;padding:2px 8px}
.chip.locked{opacity:.6}
.chip.locked b{display:flex;align-items:center;gap:6px}
.lock{width:12px;height:12px;flex:none;fill:var(--brass)}
.upsell{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;border:1px solid color-mix(in oklab,var(--brass) 45%,var(--line));background:color-mix(in oklab,var(--brass) 9%,var(--panel));border-radius:12px;padding:14px 16px;margin-bottom:14px}
.upsell p{margin:0;font-size:14px;line-height:1.5;max-width:62ch}
.upsell.flash{animation:pulse 1.2s ease 1}
.paywall{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(6px)}
.paywall .box{max-width:520px;width:100%;background:var(--panel);border:1px solid color-mix(in oklab,var(--brass) 50%,var(--line));border-radius:20px;padding:28px;display:grid;gap:14px;box-shadow:0 40px 80px -30px #000}
.paywall h2{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:1.05;margin:0;text-transform:none;letter-spacing:0;color:var(--fg)}
.paywall p{margin:0;color:var(--muted);line-height:1.55}
.paywall .price{font-family:var(--f-display);font-size:56px;font-weight:700;color:var(--brass);line-height:1}
.paywall .buy{justify-content:center;font-size:16px;padding:13px 18px}
.paywall small{color:var(--dim);font-size:12.5px;line-height:1.5}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--brass) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
</style>

/* Una mano, de grave a agudo. Derecha 1→5; izquierda 5→1 (las manos son simétricas). */
function handFingers(ms,hand){
  const n=ms.length,g=i=>ms[i+1]-ms[i],R=hand==='R',span=ms[n-1]-ms[0];
  if(n===1)return [R?1:5];
  if(n===2){const d=g(0),x=d<=2?2:d<=4?3:d<=5?4:5;return R?[1,x]:[x,1]}
  if(n===3){
    if(span<=4)return R?[1,2,3]:[3,2,1];
    return R?[1,(g(0)<=4&&g(1)>=5)?2:3,5]:[5,(g(0)>=5&&g(1)<=4)?2:3,1];
  }
  if(n===4){
    if(span<=6)return R?[1,2,3,4]:[4,3,2,1];
    return R?[1,2,g(2)<=2?4:3,5]:[5,g(0)<=2?4:3,2,1];
  }
  if(n===5)return R?[1,2,3,4,5]:[5,4,3,2,1];
  return ms.map((_,i)=>R?Math.min(5,i+1):Math.max(1,5-i));
}
/* Teclas sueltas (modo identificar y acordes especiales): una mano si cabe en una octava; si no, se reparte. */
function chordFingering(ms){
  ms=ms.slice().sort((a,b)=>a-b);const n=ms.length,out=new Map();
  if(!n)return {map:out,split:false};
  if(n<=5&&ms[n-1]-ms[0]<=12){handFingers(ms,'R').forEach((f,i)=>out.set(ms[i],{f,hand:'R'}));return {map:out,split:false}}
  const rh=[];for(let i=n-1;i>=0;i--){if(rh.length<5&&ms[n-1]-ms[i]<=12)rh.unshift(ms[i]);else break}
  const lh=ms.slice(0,n-rh.length);
  handFingers(rh,'R').forEach((f,i)=>out.set(rh[i],{f,hand:'R'}));
  handFingers(lh,'L').forEach((f,i)=>out.set(lh[i],{f,hand:'L'}));
  return {map:out,split:true};
}

/* Coloca el acorde en el teclado con mano y dedo para cada nota. */
function voiceChord(root,ch,inv,oct,handMode){
  const base=12*(oct+1)+LPC[root.l]+root.a;
  const mk=(tk,m,hand)=>({tk,m,n:spell(root,tk),hand,f:null});
  let ns,mode;
  if(twoHand(ch)){
    mode='shell';
    const r=ch.toks[0],sev=ch.toks.find(t=>t.d===6&&t.n===7),fif=ch.toks.find(t=>t.n===5);
    const lt=[r,sev||fif].filter(Boolean),rest=ch.toks.filter(t=>!lt.includes(t));
    const anc=rest.find(t=>t.n===3)||rest.find(t=>t.n===4||t.n===2)||rest[0],am=base+mod(anc.semi);
    ns=lt.map(t=>mk(t,base-12+mod(t.semi),'L')).concat(rest.map(t=>mk(t,am+mod(t.semi-anc.semi),'R')));
  } else {
    ns=ch.toks.map(t=>mk(t,base+t.semi,'R'));
    for(let i=0;i<inv&&i<ns.length;i++)ns[i].m+=12;
    mode=ch.sp?'sp':(handMode==='L'?'oneL':handMode==='B'?'bass':'one');
  }
  let lo=Math.min(...ns.map(x=>x.m)),hi=Math.max(...ns.map(x=>x.m));
  while(hi>HI){ns.forEach(x=>x.m-=12);hi-=12;lo-=12}
  while(lo<LO){ns.forEach(x=>x.m+=12);lo+=12}
  const assign=(list,hand)=>{const s=list.slice().sort((a,b)=>a.m-b.m);handFingers(s.map(x=>x.m),hand).forEach((f,i)=>{s[i].f=f;s[i].hand=hand})};
  if(mode==='shell'){assign(ns.filter(x=>x.hand==='L'),'L');assign(ns.filter(x=>x.hand==='R'),'R')}
  else if(mode==='sp'){const cf=chordFingering(ns.map(x=>x.m));ns.forEach(x=>{const v=cf.map.get(x.m);x.f=v.f;x.hand=v.hand});if(cf.split)mode='split';else mode='one'}
  else if(mode==='oneL'){assign(ns,'L')}
  else {
    assign(ns,'R');
    if(mode==='bass'){
      const low=ns.reduce((a,b)=>a.m<b.m?a:b);let bm=low.m-12;if(bm<LO)bm+=12;
      if(bm!==low.m) ns.push({tk:low.tk,m:bm,n:low.n,hand:'L',f:5,extra:true});

    }
  }

}

function dpFinger(v,blk,pcs,pref){
  const n=v.length,allow4=Math.ceil((n-1)/7);
  const nc=(i,f)=>{let c=0;if(f===5&&i<n-1)return Infinity;
    if(blk[i]){if(f===1)c+=8;if(pref[pcs[i]]!==f)c+=.3}
    else{if(i===0&&f!==1)c+=2;if(i===n-1&&f!==5)c+=f===4?.8:1.5}
    return c};
  const tr=(i,a,b)=>{const g=Math.abs(v[i+1]-v[i]),d=b-a;
    if(d===1)return g<=4?0:1.2;if(d===2)return g>=3?0:2.5;if(d===3)return g>=5?.5:3;
    if(b===1&&(a===3||a===4)){let c=g<=2?1:g===3?1.5:4;if(blk[i]&&!blk[i+1])c-=.5;return c}
    if(b===1&&a===2)return 3.5;return Infinity};
  let cur=new Map();
  for(let f=1;f<=5;f++){const c=nc(0,f);if(c<Infinity)cur.set(f*10+(f===4?1:0),{cost:c,path:[f]})}
  for(let i=1;i<n;i++){
    const nx=new Map();
    for(const [k,st] of cur){
      const a=Math.floor(k/10),c4=k%10;
      for(let b=1;b<=5;b++){
        const t=tr(i-1,a,b),c=nc(i,b);if(t===Infinity||c===Infinity)continue;
        const key=b*10+Math.min(9,c4+(b===4&&i<n-1?1:0)),cost=st.cost+t+c,old=nx.get(key);
        if(!old||cost<old.cost)nx.set(key,{cost,path:st.path.concat(b)});
      }
    }

  }
  let best=null;
  for(const [k,st] of cur){const c=st.cost+Math.max(0,k%10-allow4)*.6;if(!best||c<best.c)best={c,path:st.path}}

}
function fingerScale(sc,ms,hand){
  const n=ms.length,tab=STD[hand][sc.id];
  if(tab&&n===8){

    if(!f.some((x,i)=>x===1&&isBlk(ms[i])))return {f,std:true};

const ROM=['I','II','III','IV','V','VI','VII'];
function diatonic(sc){
  if(sc.toks.length!==7)return null;
  const semis=sc.toks.map(t=>mod(t.semi));
  const build=size=>sc.toks.map((tk,i)=>{
    const iv=[];for(let k=0;k<size;k++)iv.push(mod(semis[(i+2*k)%7]-semis[i]));
    const key=iv.slice().sort((a,b)=>a-b).join(',');
    const ch=CH.find(c=>!c.sp&&c.size===size&&c.toks.length===size&&c.pcKey===key);
    let r=ROM[i];const minor=iv[1]===3,dim=minor&&iv[2]===6,aug=iv[1]===4&&iv[2]===8;
    if(minor)r=r.toLowerCase();if(dim)r+='°';else if(aug)r+='+';
    const pre=tk.acc<0?'♭'.repeat(-tk.acc):tk.acc>0?'♯'.repeat(tk.acc):'';
    return {i,root:spell(S.root,tk),ch,rn:pre+r};
  });

function identify(){

  const pcs=[...new Set(ms.map(m=>m%12))],bass=ms[0]%12,res=[];
  for(const r of pcs){

    CH.forEach((c,idx)=>{if(c.pcKey===rel)res.push({rootPc:r,c,bass,score:idx+(r===bass?0:300)+(c.sp?150:0)})});

}

/* ================= Audio ================= */
let AC=null,master=null,revSend=null;
function audio(){
  if(AC)return AC;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  AC=new C();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;
  master=AC.createGain();master.gain.value=S.vol;master.connect(comp);comp.connect(AC.destination);
  const rev=AC.createConvolver(),len=Math.floor(AC.sampleRate*2.6),buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
  rev.buffer=buf;revSend=AC.createGain();revSend.gain.value=.2;revSend.connect(rev);rev.connect(master);
  return AC;
}
const PARTIALS=[[1,1],[2,.5],[3,.27],[4,.16],[5,.1],[6,.06],[7,.035],[8,.02]];
function noteOn(m,t,vel=.75){
  const ac=audio();if(!ac)return null;
  if(ac.state==='suspended')ac.resume();
  t=t??ac.currentTime;
  const f=440*Math.pow(2,(m-69)/12),out=ac.createGain(),lp=ac.createBiquadFilter();
  lp.type='lowpass';lp.Q.value=.4;
  const decay=1.3+(HI-m)/(HI-LO)*5.2;
  lp.frequency.setValueAtTime(Math.min(15000,f*(5+vel*7)),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(240,f*1.5),t+decay*.8);
  const oscs=[];
  for(const [n,a] of PARTIALS){
    const fr=f*n*Math.sqrt(1+.00035*n*n);if(fr>15000)break;
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=fr;o.detune.value=(Math.random()-.5)*5;g.gain.value=a;
    o.connect(g);g.connect(lp);o.start(t);oscs.push(o);
  }
  lp.connect(out);out.connect(master);out.connect(revSend);
  const pk=.15*vel*(m<48?1.35:1);
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(pk,t+.005);
  out.gain.setTargetAtTime(pk*.4,t+.005,.13);out.gain.setTargetAtTime(0,t+.3,decay/4);
  const end=t+decay+.4;oscs.forEach(o=>o.stop(end));
  return {out,oscs};
}
function noteOff(v,t){
  if(!v||!AC)return;
  t=t??AC.currentTime;const g=v.out.gain;
  if(g.cancelAndHoldAtTime)g.cancelAndHoldAtTime(t);else{g.cancelScheduledValues(t);g.setValueAtTime(g.value,t)}
  g.setTargetAtTime(0,t,.09);
  v.oscs.forEach(o=>{try{o.stop(t+.8)}catch(e){}});
}
function flash(m,ms){const el=K[m];if(!el)return;el.classList.add('press');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('press'),ms)}
function playSet(ms,style){
  const ac=audio();if(!ac)return;
  const t0=ac.currentTime+.03,sorted=[...new Set(ms)].sort((a,b)=>a-b);
  sorted.forEach((m,i)=>{
    const dt=style==='arp'?i*.14:i*.012;
    noteOn(m,t0+dt,.72);setTimeout(()=>flash(m,style==='arp'?900:700),dt*1000+30);
  });
}
function playScaleRun(lists){
  const ac=audio();if(!ac)return;
  const t0=ac.currentTime+.03;
  lists.forEach(ms=>{
    const up=ms.slice().sort((a,b)=>a-b),seq=up.concat(up.slice(0,-1).reverse());
    seq.forEach((m,i)=>{const t=t0+i*.24,v=noteOn(m,t,.68);noteOff(v,t+.34);setTimeout(()=>flash(m,280),i*240+30)});
  });
}

  }

    if(S.overlay){const o=S.overlay;return voiceChord(o.root,o.ch,0,S.oct,'R').map(x=>({m:x.m,role:role(x.tk),name:nm(x.n),f:x.f,hand:x.hand}))}

  const m=+k.dataset.m;

const KM={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,'ñ':16,';':16};
const kbHeld=new Map();

  if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();transposeBy((e.key==='ArrowUp'?1:-1)*(e.shiftKey?2:1));return}
  const k=e.key.toLowerCase();

/* ================= Transportador ================= */
const KEY_MAJ=[[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[3,1],[4,0],[5,-1],[5,0],[6,-1],[6,0]].map(([l,a])=>({l,a}));
const KEY_MIN=[[0,0],[0,1],[1,0],[2,-1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[6,-1],[6,0]].map(([l,a])=>({l,a}));
const SOLF={Do:0,Re:1,Mi:2,Fa:3,Sol:4,La:5,Si:6};
const ACCIN={'#':1,'##':2,'♯':1,'𝄪':2,'b':-1,'bb':-2,'♭':-1,'𝄫':-2};
function canonSuf(x){
  let s=x.replace(/♭/g,'b').replace(/♯/g,'#').replace(/[()\[\]\s,]/g,'').replace(/[Δ∆]/g,'maj');
  s=s.replace(/^m(M|Maj|MAJ|Ma)(?=\d)/,'mmaj').replace(/^(major|mayor|Maj|MAJ|Ma(?=\d)|M(?=\d|$|add|sus|b|#))/,'maj');
  if(s==='maj')s='';
  s=s.replace(/^(minor|menor|min|mi(?!n)|-(?=\d|$|maj|add|b|#|6))/,'m');
  s=s.replace(/ø7?/,'m7b5').replace(/^dim/,'°').replace(/^o(?=7|$)/,'°').replace(/^aug/,'+').replace(/m7-5/,'m7b5');
  s=s.replace(/^7(\+5|#5)$/,'+7').replace(/^maj7(\+5|#5)$/,'+maj7').replace(/^sus$/,'sus4').replace(/^7sus$/,'7sus4');
  if(s==='69')s='6/9';if(s==='m69')s='m6/9';if(s==='alt')s='7alt';if(s==='2')s='sus2';if(s==='4')s='sus4';
  return s;
}
const SUF2ID=new Map();
CH.forEach(c=>{if(!c.sp){const k=canonSuf(Array.isArray(c.sym)?c.sym[0]:c.sym);if(!SUF2ID.has(k))SUF2ID.set(k,c.id)}});
const ROOT_EN=/^([A-G])(##|bb|#|b|♯|♭|𝄪|𝄫)?(.*)$/, ROOT_SO=/^(Do|Re|Mi|Fa|Sol|La|Si)(##|bb|#|b|♯|♭|𝄪|𝄫)?(.*)$/;
/* Lecturas posibles de la nota inicial: primero Do Re Mi (Do es Do, no D°), luego letras (Fadd9 es F add9). */
function parseRoots(t){
  const out=[];let m=ROOT_SO.exec(t);
  if(m)out.push({root:{l:SOLF[m[1]],a:m[2]?ACCIN[m[2]]:0},rest:m[3]});
  m=ROOT_EN.exec(t);
  if(m)out.push({root:{l:LET.indexOf(m[1]),a:m[2]?ACCIN[m[2]]:0},rest:m[3]});
  return out;
}
function parseChord(raw){
  let t=raw.trim().replace(/^\(|\)$/g,'');
  if(!t)return null;
  t=t.replace(/^(do|re|mi|fa|sol|la|si)(?=[#b♯♭m7°+]|$|sus|add|maj|dim|aug)/i,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
  for(const pr of parseRoots(t)){
    let suf=pr.rest,bass=null;
    const sl=suf.lastIndexOf('/');
    if(sl>=0){const b=parseRoots(suf.slice(sl+1)).find(x=>x.rest==='');if(b){bass=b.root;suf=suf.slice(0,sl)}}
    const id=SUF2ID.get(canonSuf(suf));
    if(id)return {raw,ok:true,root:pr.root,ch:CH.find(c=>c.id===id),bass};
  }
  return {raw,ok:false};
}
const SKIP=/^(N\.?C\.?|%|x\d+|\d+x|\(|\)|-+|–|—|:|\.|\|:|:\|)$/i;
function parseProgression(text){
  return text.split(/[\s|,;]+/).filter(w=>w&&!SKIP.test(w)).slice(0,64).map(parseChord).filter(Boolean);
}
const chordClass=c=>{const p=c.pcKey.split(',').map(Number);if(p.includes(4))return p.includes(8)&&!p.includes(7)?'aug':'maj';if(p.includes(3))return p.includes(6)&&!p.includes(7)?'dim':'min';return 'sus'};
const MAJ_EXP=['maj','min','min','maj','maj','min','dim'], MIN_EXP=['min','dim','maj','min','min','maj','maj'];
const MAJ_BASE=[0,2,4,5,7,9,11], MIN_BASE=[0,2,3,5,7,8,10];
function detectKey(items){
  const ok=items.filter(x=>x.ok);if(!ok.length)return null;
  let best=null;
  for(let pc=0;pc<12;pc++)for(const minor of [false,true]){
    const base=minor?MIN_BASE:MAJ_BASE,exp=minor?MIN_EXP:MAJ_EXP;let sc=0;
    ok.forEach((x,i)=>{
      const rel=mod(pcOf(x.root)-pc),cls=chordClass(x.ch),d=base.indexOf(rel);
      if(d>=0)sc+=cls===exp[d]||cls==='sus'?2:(minor&&d===4&&cls==='maj'?2:0.6);
      else if(minor&&rel===11&&cls==='dim')sc+=1.5;
      else sc-=1;
      const tonic=rel===0&&(cls===(minor?'min':'maj')||cls==='sus');
      if(tonic&&i===0)sc+=1.5;if(tonic&&i===ok.length-1)sc+=2;
    });
    if(!best||sc>best.sc+1e-9||(Math.abs(sc-best.sc)<1e-9&&!minor&&best.minor))best={pc,minor,sc};
  }
  const same=ok.find(x=>pcOf(x.root)===best.pc);
  return {pc:best.pc,minor:best.minor,root:same?same.root:(best.minor?KEY_MIN:KEY_MAJ)[best.pc]};
}
function trFromKey(items){
  if(S.trFrom!=='auto'){const pc=parseInt(S.trFrom),minor=S.trFrom.endsWith('m');return {pc,minor,root:(minor?KEY_MIN:KEY_MAJ)[pc]}}

}
function transposeRoot(r,from,to){
  const steps=mod(r.l-from.l,7),semi=mod(pcOf(r)-pcOf(from));
  return spell(to,{d:steps,semi});
}
function romanOf(x,key){
  const steps=mod(x.root.l-key.root.l,7),semi=mod(pcOf(x.root)-key.pc),base=key.minor?MIN_BASE:MAJ_BASE;
  let acc=semi-base[steps];if(acc>6)acc-=12;if(acc<-6)acc+=12;
  const cls=chordClass(x.ch);let r=ROM[steps];
  if(cls==='min'||cls==='dim')r=r.toLowerCase();
  if(x.ch.id==='m7♭5'||x.ch.id==='ø♭9'||x.ch.id==='ø11'||x.ch.id==='m9♭5')r+='ø';else if(cls==='dim')r+='°';else if(cls==='aug')r+='+';
  return (acc<0?'♭'.repeat(-acc):acc>0?'♯'.repeat(acc):'')+r;

const keyName=k=>`${nm(k.root)} ${k.minor?T('trMinor'):T('trMajor')}`;
function trState(){

    return Object.assign({},x,{nr,nb,text:symText(nr,x.ch)+(nb?'/'+nm(nb):''),rn:romanOf(x,from)});
  });

}
function trVoicing(x){

  if(!x.nb)return voiceChord(x.nr,x.ch,0,S.oct,S.hand);

    const low=Math.min(...vs.map(v=>v.m));let bm=12*(S.oct+1)+mod(pcOf(x.nb)-0);while(bm>=low)bm-=12;if(bm<LO)bm+=12;

function trStop(){if(trTimer){clearTimeout(trTimer);trTimer=null}}

/* ================= Transporte rápido (+/− medio tono o tono) ================= */

function tpSpelling(pc){
  if(S.mode==='chord')return (chordClass(curChord())==='min'||chordClass(curChord())==='dim'?KEY_MIN:KEY_MAJ)[pc];
  if(S.mode==='scale')return (isMinorScale(curScale())?KEY_MIN:KEY_MAJ)[pc];
  const st=trState();return ((st.from&&st.from.minor)?KEY_MIN:KEY_MAJ)[pc];
}
function tpReset(){S.tpBase=null;S.tpSemis=0}
function transposeBy(n){
  trStop();
  if(S.mode==='id'){
    if(!S.ids.size)return;const ms=[...S.ids].map(m=>m+n);
    if(ms.some(m=>m<LO||m>HI))return;
    S.ids=new Set(ms);S.tpSemis+=n;renderAll(true);playSet(ms,'block');return;
  }
  if(!S.tpBase)S.tpBase={...S.root};
  S.tpSemis+=n;while(S.tpSemis>=12)S.tpSemis-=12;while(S.tpSemis<=-12)S.tpSemis+=12;
  const pc=mod(pcOf(S.tpBase)+S.tpSemis);
  S.root=S.tpSemis===0?{...S.tpBase}:tpSpelling(pc);
  if(S.tpSemis===0)S.tpBase=null;
  S.overlay=null;renderAll(true);
  if(S.mode==='chord')playSet(chordMidis(),'block');
  else if(S.mode==='scale')playScaleRun(Object.values(scaleLayout()).map(h=>h.notes.map(x=>x.m)));
  else if(S.mode==='tr'){const v=trVoicing(trState().items[S.trSel]);if(v)playSet(v.map(x=>x.m),'block')}
}
function tpBack(){

}

function stepPattern(sc){

function fingerChips(list){
  const Ls=list.filter(x=>x.hand==='L').sort((a,b)=>a.m-b.m),Rs=list.filter(x=>x.hand!=='L').sort((a,b)=>a.m-b.m);
  const chip=x=>`<span class="fchip${x.hand==='L'?' lh':''}">${x.name}<b>${x.f}</b></span>`;
  let h='';

  if(Rs.length)h+=`<div class="fseq">${Ls.length?`<span class="hl">${T('rhL')}</span>`:''}${Rs.map(chip).join('')}</div>`;

function chordFingerHTML(vs){

  const key={one:'fOne',oneL:'fOneL',bass:'fBass',shell:'fShell',split:'fSplit',slash:'fSlash'}[vs.mode]||'fOne';
  return fingerChips(list)+`<p class="fnote">${T(key)}</p>`;
}
function scaleFingerHTML(){
  const lay=scaleLayout();let h='',notes=[];
  ['L','R'].forEach(hd=>{
    const x=lay[hd];if(!x)return;
    const list=x.notes.map(n=>({m:n.m,name:nm(n.n),f:n.f,hand:hd}));
    h+=fingerChips(list);
    for(let i=1;i<list.length;i++){
      if(hd==='R'&&list[i].f===1)notes.push(T('crossR')(list[i-1].name,list[i-1].f,list[i].name));
      if(hd==='L'&&list[i-1].f===1&&i<list.length)notes.push(T('crossL')(list[i-1].name,list[i].f,list[i].name));
    }
    const src=x.chrom?T('chromSrc'):x.std?T('stdSrc'):T('calcSrc');
    if(!notes.includes(src))notes.push(src);

  return h+`<ul class="fnote">${[...new Set(notes)].map(c=>`<li>${c}</li>`).join('')}</ul>`;
}

    for(const r of ROOTS)for(const ch of CH)for(const hm of ['R','L','B'])for(let inv=0;inv<invCount(ch);inv++){
      const name=`${symText(r,ch)} inv${inv} ${hm}`,vs=voiceChord(r,ch,inv,4,hm);nV++;
      const ms=vs.map(x=>x.m);if(new Set(ms).size!==ms.length)fail('nota repetida '+name);

    click('#library [data-ex="2"]');ok(S.trText==='Dm7 G7 Cmaj7'&&document.querySelectorAll('#readout .tr-card').length===3,'cargar un ejemplo');
    const fs=document.querySelector('#trFromSel');ok(!!fs,'selector de tono original');
    if(fs){fs.value='2M';fs.dispatchEvent(new Event('change',{bubbles:true}));ok(S.trFrom==='2M','cambiar el tono original a mano')}
    click('#side .row[data-l="4"][data-a="0"]');ok(S.root.l===4,'pasar la canción a otro tono desde la lista de 12 tonos');
    click('#controls #trOne');
    if(ti){const t2=document.querySelector('#trIn');t2.value='G Xq7 C';t2.dispatchEvent(new Event('input',{bubbles:true}));ok(document.querySelectorAll('#readout .tr-card.bad').length===1,'avisar de un acorde desconocido sin romperse')}
    S.trText='G D Em C';S.trFrom='auto';S.trInit=false;click('#tabs button[data-mode="chord"]');
    /* Transporte rápido junto al teclado */
    const lat1=S.lat;S.lat=false;const lang1=S.lang;S.lang='en';
    const TPN=()=>(document.querySelector('#tp output')||{}).textContent||'';
    click('#tabs button[data-mode="chord"]');click('#roots .rb[data-l="0"][data-a="0"]');click('#library .chip[data-id="maj7"]');
    ok(!!document.querySelector('#tp [data-tp="2"]'),'barra de transporte visible junto al teclado');
    click('#tp [data-tp="2"]');ok(symText(S.root,curChord())==='Dmaj7'&&/Cmaj7 → Dmaj7/.test(TPN())&&/\+1 step/.test(TPN()),'Cmaj7 +1 tono = Dmaj7');
    click('#tp [data-tp="-1"]');ok(symText(S.root,curChord())==='D♭maj7','Dmaj7 −½ = D♭maj7');
    click('#tp [data-tp="-1"]');ok(symText(S.root,curChord())==='Cmaj7'&&/original/.test(TPN()),'volver exactamente a Cmaj7');
    for(let i=0;i<12;i++)click('#tp [data-tp="1"]');ok(symText(S.root,curChord())==='Cmaj7','12 medios tonos = vuelta completa a Cmaj7');
    click('#library .chip[data-id="m"]');click('#roots .rb[data-l="5"][data-a="0"]');click('#tp [data-tp="1"]');ok(symText(S.root,curChord())==='B♭m','Am +½ = B♭m');
    click('#tp [data-tp="2"]');ok(symText(S.root,curChord())==='Cm','B♭m +1 = Cm');
    click('#tp [data-tp="back"]');ok(symText(S.root,curChord())==='Am','botón volver al tono original');
    document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp'}));ok(symText(S.root,curChord())==='B♭m','flecha ↑ sube medio tono');
    document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',shiftKey:true}));ok(symText(S.root,curChord())==='G♯m','Mayús+↓ baja un tono (G♯m, la escritura habitual)');
    click('#tabs button[data-mode="scale"]');click('#library .chip[data-id="s0"]');click('#roots .rb[data-l="0"][data-a="0"]');
    click('#tp [data-tp="1"]');ok(nm(S.root)==='D♭','escala de C mayor +½ = D♭ mayor');
    click('#library .chip[data-id="s5"]');click('#roots .rb[data-l="5"][data-a="0"]');click('#tp [data-tp="1"]');ok(nm(S.root)==='B♭','La menor +½ = Si♭ menor');
    click('#tabs button[data-mode="tr"]');const t3=document.querySelector('#trIn');if(t3){t3.value='G D Em C';t3.dispatchEvent(new Event('input',{bubbles:true}))}
    click('#roots .rb[data-l="4"][data-a="0"]');click('#tp [data-tp="2"]');
    ok([...document.querySelectorAll('#readout .tr-card .new')].map(e=>e.textContent).join(' ')==='A E F♯m D','canción G D Em C +1 tono = A E F♯m D');
    click('#tabs button[data-mode="id"]');for(const m of [60,64,67])K[m].dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:3}));
    click('#tp [data-tp="2"]');const ti2=identify().res[0];ok(ti2&&ti2.rootPc===2&&ti2.c.id==='M','teclas C-E-G +1 tono = D mayor');
    click('#idclear');S.lat=lat1;S.lang=lang1;tpReset();S.trText='G D Em C';S.trFrom='auto';S.trInit=false;click('#tabs button[data-mode="chord"]');
    out.uiChecks=ui;
    const hasAudio=!!(window.AudioContext||window.webkitAudioContext);
    out.audio=hasAudio?(AC?AC.state:'sin crear'):'no disponible';
    if(hasAudio){if(!AC)fail('el sonido no se inicializó');else{const v=noteOn(60);if(!v||!v.oscs.length)fail('no se pudo generar una nota');else noteOff(v)}}
  }catch(e){fail('excepción: '+(e&&e.stack||e))}
  Object.assign(S,keep);setKW(keep.kw);savePrefs();renderAll(false);
  out.voicings=nV;out.scaleLayouts=nS;out.thumbOnBlack=thumbBlack;out.errors=(window.__errs||[]).slice();
  return JSON.stringify(out);
};

/* arranque */
setKW(fitKW());
renderAll(false);
requestAnimationFrame(()=>scrollToActive());

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
